name: Deploy BCW Plugin + Theme (STAGING)

on:
  push:
    branches:
      - staging
    paths:
      - "oz-variations-bcw/**"
      - "oz-theme/**"
      - ".github/workflows/deploy-bcw-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-bcw-staging
  cancel-in-progress: false  # queue instead of cancel; same rationale as prod

jobs:
  deploy:
    # Self-hosted runner draait als gh-runner user op de Hetzner server.
    # Geen SSH meer nodig - runner heeft directe disk-toegang via sudoers entry.
    runs-on: [self-hosted, linux, bcw]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build JS bundles
        working-directory: oz-variations-bcw
        run: npm ci && npm run build

      - name: Ensure staging target directories
        run: |
          sudo /usr/bin/install -d -o bcwstaging -g bcwstaging -m 750 \
            /home/bcwstaging/public_html/wp-content/plugins/oz-variations-bcw \
            /home/bcwstaging/public_html/wp-content/themes/OzTheme

      - name: Deploy plugin files to staging
        run: |
          sudo /usr/bin/rsync -az --delete \
            --chown=bcwstaging:bcwstaging \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".DS_Store" \
            --exclude ".claude" \
            --exclude "node_modules" \
            --exclude "src" \
            --exclude "esbuild.config.mjs" \
            --exclude "package.json" \
            --exclude "package-lock.json" \
            --exclude "*.map" \
            ./oz-variations-bcw/ \
            /home/bcwstaging/public_html/wp-content/plugins/oz-variations-bcw/

      - name: Deploy child theme to staging
        run: |
          sudo /usr/bin/rsync -az --delete \
            --chown=bcwstaging:bcwstaging \
            --exclude ".git" \
            --exclude ".DS_Store" \
            --exclude ".claude" \
            ./oz-theme/ \
            /home/bcwstaging/public_html/wp-content/themes/OzTheme/

      - name: Purge nginx FastCGI cache on staging
        run: sudo /usr/bin/find /var/cache/nginx/bcwstaging -type f -delete
